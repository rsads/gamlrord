<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#07172b">

<title>Cricket Analyst™</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#07172b;
    color:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= BACKGROUND ================= */

.page{
    width:100%;
    height:100svh;
    min-height:100svh;
    position:relative;
    overflow:hidden;

    background:
    radial-gradient(
        circle at 90% 10%,
        rgba(55,120,210,.16),
        transparent 35%
    ),
    radial-gradient(
        circle at 10% 90%,
        rgba(30,80,150,.12),
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #07172b,
        #0b1c31 55%,
        #061426
    );
}

/* subtle grid */

.page:before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    linear-gradient(
        rgba(255,255,255,.025) 1px,
        transparent 1px
    ),
    linear-gradient(
        90deg,
        rgba(255,255,255,.025) 1px,
        transparent 1px
    );

    background-size:55px 55px;
    opacity:.35;
}

/* ================= FLOATING BALLS ================= */

.ball{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;

    background:
    radial-gradient(
        circle at 32% 28%,
        #ff6257,
        #b71919 55%,
        #570707
    );

    box-shadow:
    0 0 16px rgba(255,40,30,.35);

    opacity:.45;
}

.ball:after{
    content:"";
    position:absolute;

    width:70%;
    height:70%;

    left:15%;
    top:15%;

    border-top:1px dashed rgba(255,255,255,.7);
    border-bottom:1px dashed rgba(255,255,255,.7);

    border-radius:50%;

    transform:rotate(40deg);
}

.ball1{
    left:7%;
    bottom:-30px;
    animation:moveBall 13s linear infinite;
}

.ball2{
    left:82%;
    bottom:-30px;
    width:13px;
    height:13px;
    animation:moveBall 17s linear infinite 3s;
}

.ball3{
    left:45%;
    bottom:-30px;
    width:11px;
    height:11px;
    animation:moveBall 15s linear infinite 6s;
}

@keyframes moveBall{

    0%{
        transform:
        translateY(0)
        translateX(0)
        rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:.45;
    }

    50%{
        transform:
        translateY(-55vh)
        translateX(80px)
        rotate(720deg);
    }

    100%{
        transform:
        translateY(-115vh)
        translateX(-70px)
        rotate(1440deg);
        opacity:0;
    }
}

/* ================= MAIN CARD ================= */

.wrapper{
    width:min(92%,480px);
    height:calc(100svh - 10px);
    max-height:780px;

    position:relative;
    z-index:5;

    display:flex;
    align-items:center;
    justify-content:center;
}

.card{

    width:100%;
    height:100%;

    position:relative;
    overflow:hidden;

    padding:
    clamp(18px,4vw,28px);

    border-radius:48px;

    border:2px solid rgba(190,145,35,.55);

    background:
    linear-gradient(
        160deg,
        #091a30,
        #0a1b30 50%,
        #08172a
    );

    box-shadow:
    0 25px 80px rgba(0,0,0,.5),
    inset 0 0 45px rgba(255,255,255,.015);
}

/* ================= HEADER ================= */

.header{
    text-align:center;
}

.title{
    font-size:
    clamp(32px,9vw,48px);

    line-height:.95;
    font-weight:950;
    letter-spacing:-1.5px;

    background:
    linear-gradient(
        90deg,
        #f2bd28,
        #ffe17a,
        #d79b16
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.title2{
    display:block;

    background:
    linear-gradient(
        90deg,
        #aab4bf,
        #5d94df,
        #2771dd
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.tagline{
    margin-top:10px;

    font-size:9px;
    letter-spacing:3px;

    color:#9ba6b5;

    font-weight:900;
}

/* ================= PROFILE BOX ================= */

.profile{
    margin-top:30px;

    min-height:125px;

    display:flex;
    align-items:center;

    gap:20px;

    padding:18px;

    border-radius:30px;

    background:
    linear-gradient(
        135deg,
        rgba(36,57,82,.78),
        rgba(20,35,53,.82)
    );

    border:
    1px solid rgba(133,163,194,.22);

    box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);
}

.logo{
    width:108px;
    height:108px;

    flex:none;

    object-fit:cover;

    border-radius:19px;

    border:2px solid #d5a528;

    box-shadow:
    0 0 22px rgba(218,169,30,.22);
}

.profile-content{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:9px;
}

.elite{
    padding:8px 13px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #235fe0,
        #376ee9
    );

    font-size:8px;
    font-weight:950;

    box-shadow:
    0 5px 15px rgba(38,100,220,.25);
}

.analysis{
    padding:9px 15px;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #ffb80e,
        #ffc82e
    );

    color:#101010;

    font-size:8px;
    font-weight:950;

    box-shadow:
    0 7px 18px rgba(255,185,20,.2);
}

/* ================= CTA ================= */

.cta{
    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;

    min-height:78px;

    margin-top:35px;

    border-radius:20px;

    text-decoration:none;

    position:relative;
    overflow:hidden;

    color:white;

    font-size:
    clamp(17px,5vw,22px);

    font-weight:950;

    letter-spacing:.5px;

    background:
    linear-gradient(
        110deg,
        #1677f0,
        #275ee4,
        #1948bc,
        #1677f0
    );

    background-size:300% 100%;

    border:
    2px solid #d3a400;

    box-shadow:
    0 12px 35px rgba(15,90,220,.3),
    0 0 25px rgba(30,105,240,.18);

    animation:
    ctaGradient 4s ease infinite,
    ctaPulse 2.3s ease-in-out infinite;
}

.cta:before{

    content:"";

    position:absolute;

    left:-110%;
    top:0;

    width:70%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.38),
        transparent
    );

    transform:skewX(-22deg);

    animation:
    shine 2.8s infinite;
}

.cta-text{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    gap:12px;
}

.telegram{
    width:37px;
    height:37px;

    border-radius:50%;

    display:grid;
    place-items:center;

    background:white;

    color:#2875dd;

    font-size:21px;

    box-shadow:
    0 4px 12px rgba(0,0,0,.18);
}

@keyframes ctaGradient{

    0%,100%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }
}

@keyframes ctaPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.025);
    }
}

@keyframes shine{

    0%{
        left:-110%;
    }

    45%,100%{
        left:140%;
    }
}

/* ================= BENEFITS ================= */

.benefits{
    margin-top:34px;

    display:flex;
    flex-direction:column;
    gap:13px;
}

.benefit{

    min-height:61px;

    display:flex;
    align-items:center;

    gap:17px;

    padding:12px 18px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        rgba(30,49,72,.85),
        rgba(22,35,51,.85)
    );

    border:
    1px solid rgba(102,142,190,.25);

    font-size:12px;
    font-weight:900;

    letter-spacing:.3px;
}

.icon{
    width:27px;
    height:27px;

    display:grid;
    place-items:center;

    flex:none;

    color:#56a5ff;

    font-size:20px;
}

/* ================= FOOTER ================= */

.footer-line{

    height:1px;

    margin-top:34px;

    background:
    rgba(150,170,190,.16);
}

.disclaimer{

    text-align:center;

    margin-top:25px;

    color:#56667a;

    font-size:7px;

    letter-spacing:2px;

    font-weight:800;
}


/* ================= MOBILE ================= */

@media(max-width:390px){

    .wrapper{
        width:94%;
        height:calc(100svh - 8px);
    }

    .card{
        padding:15px;
        border-radius:40px;
    }

    .title{
        font-size:31px;
    }

    .tagline{
        font-size:7px;
        letter-spacing:2.4px;
    }

    .profile{
        margin-top:21px;
        min-height:104px;
        padding:13px;
        gap:13px;
    }

    .logo{
        width:91px;
        height:91px;
    }

    .profile-content{
        gap:7px;
    }

    .elite,
    .analysis{
        padding:7px 10px;
        font-size:7px;
    }

    .cta{
        margin-top:22px;
        min-height:66px;
        font-size:16px;
    }

    .telegram{
        width:32px;
        height:32px;
        font-size:18px;
    }

    .benefits{
        margin-top:22px;
        gap:9px;
    }

    .benefit{
        min-height:52px;
        padding:9px 14px;
        font-size:10px;
    }

    .icon{
        width:24px;
        font-size:18px;
    }

    .footer-line{
        margin-top:20px;
    }

    .disclaimer{
        margin-top:16px;
        font-size:6px;
    }
}


/* SHORT SCREENS */

@media(max-height:680px){

    .profile{
        margin-top:15px;
    }

    .cta{
        margin-top:15px;
        min-height:58px;
    }

    .benefits{
        margin-top:15px;
        gap:7px;
    }

    .benefit{
        min-height:46px;
    }

    .footer-line{
        margin-top:14px;
    }

    .disclaimer{
        margin-top:10px;
    }
}

</style>
</head>


<body>

<div class="page">

    <!-- Animated cricket balls -->
    <div class="ball ball1"></div>

    <div class="ball ball3"></div>


    <div class="wrapper">

        <main class="card">


            <!-- HEADER -->

            <header class="header">

                <div class="title">

                </div>

                </div>

            </header>


            <!-- PROFILE -->

            <section class="profile">

                <img
                    src="./logo.jpg"

                    alt="Cricket Analyst Logo"
                >

                <div class="profile-content">

                    <div class="elite">
                        🏆 THE ELITE
                    </div>

                    <div class="analysis">
                        SMART CRICKET ANALYSIS
                    </div>

                </div>

            </section>


            <!-- CTA -->

            <a
                href="https://t.me/+JMl7gkSRsqIyMmFl"
                class="cta"
                target="_blank"
                rel="noopener noreferrer">

                <div class="cta-text">

                    <div class="telegram">
                        ➤
                    </div>

                    <span>
                        JOIN CHANNEL
                    </span>

                </div>

            </a>


            <!-- BENEFITS -->

            <section class="benefits">

                <div class="benefit">

                    <div class="icon">
                        ✓
                    </div>

                    <span>
                        STRATEGIC CRICKET ANALYSIS
                    </span>

                </div>


                <div class="benefit">

                    <div class="icon">
                        ⚡
                    </div>

                    <span>
                        MATCH & TEAM UPDATES
                    </span>

                </div>


                <div class="benefit">

                    <div class="icon">
                        ◈
                    </div>

                    <span>
                        PLAYER FORM & KEY STATS
                    </span>

                </div>

            </section>


            <!-- FOOTER -->

            <div class="footer-line"></div>

            <div class="disclaimer">
                FOR INFORMATION & ENTERTAINMENT PURPOSES ONLY
            </div>


        </main>

    </div>

</div>

</body>
</html>
